name: Playwright Smoke CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}
      BASE_URL: http://localhost:8080
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      ###################################################
      # Login to private DockerHub
      ###################################################
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ###################################################
      # Pull developer app image
      ###################################################
      - name: Pull app image
        run: docker pull nnconsul/private-grocery-app:latest

      ###################################################
      # Start app container
      ###################################################
      - name: Start app container
        run: |
          docker run -d \
            --name grocery-app \
            -p 8080:8080 \
            mycompany/private-grocery-app:latest

      ###################################################
      # Wait for app readiness
      ###################################################
      - name: Wait for app startup
        run: |
          timeout 60 bash -c \
          'until curl -f http://localhost:8080; do sleep 5; done'

      ###################################################
      # Run smoke tests
      ###################################################
      - name: Execute smoke suite
        run: npm run smoke

      ###################################################
      # Upload junit.xml to Datadog
      ###################################################
      - name: Upload JUnit report to Datadog
        if: always()
        run: |
          npm install -g @datadog/datadog-ci
          datadog-ci junit upload test-results/junit.xml

      ###################################################
      # Upload artifacts
      ###################################################
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/

      ###################################################
      # Cleanup
      ###################################################
      - name: Stop container
        if: always()
        run: docker stop grocery-app || true